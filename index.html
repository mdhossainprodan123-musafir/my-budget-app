<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাসিক খরচ ট্র্যাকার - প্রো</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- পিডিএফ জেনারেটর লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- এক্সটার্নাল সিএসএস ফাইল লিঙ্ক -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans relative">

    <!-- কাস্টম প্রফেশনাল বাংলা কনফার্মেশন পপ-আপ -->
    <div id="customModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center transform scale-95 transition-all duration-300">
            <div class="text-red-500 text-5xl mb-3">⚠️</div>
            <h3 class="text-lg font-bold text-gray-800 mb-2">আপনি কি নিশ্চিত?</h3>
            <p class="text-sm text-gray-500 mb-6">সব ডাটা মুছে ফেললে তা আর ফিরে পাওয়া যাবে না।</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal()" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-semibold text-sm hover:bg-gray-300 transition w-1/2">না, থাক</button>
                <button onclick="confirmClearAll()" class="bg-red-600 text-white px-5 py-2 rounded-lg font-semibold text-sm hover:bg-red-700 transition shadow-md w-1/2">হ্যাঁ, মুছুন</button>
            </div>
        </div>
    </div>

    <!-- মেইন অ্যাপ কন্টেইনার -->
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 mt-4">
        
        <!-- এই অংশটুকুর আসল পিডিএফ ডাউনলোড হবে -->
        <div id="printArea" class="bg-white p-2">
            <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">📊 মাসিক খরচ ট্র্যাকার</h2>

            <!-- ড্যাশবোর্ড কার্ড (বাজেট, খরচ ও ব্যালেন্স) -->
            <div class="grid grid-cols-3 gap-2 mb-6">
                <div class="bg-green-50 p-3 rounded-xl text-center border border-green-200">
                    <p class="text-[10px] text-gray-500 font-bold uppercase">মোট বাজেট</p>
                    <p class="text-sm font-bold text-green-600 mt-1"><span id="displayBudget">0</span> ৳</p>
                </div>
                <div class="bg-amber-50 p-3 rounded-xl text-center border border-amber-200">
                    <p class="text-[10px] text-gray-500 font-bold uppercase">মোট খরচ</p>
                    <p class="text-sm font-bold text-amber-600 mt-1"><span id="displayTotalExpense">0</span> ৳</p>
                </div>
                <div class="bg-red-50 p-3 rounded-xl text-center border border-red-200">
                    <p class="text-[10px] text-gray-500 font-bold uppercase">অবশিষ্ট</p>
                    <p class="text-sm font-bold text-red-600 mt-1"><span id="remainingBalance">0</span> ৳</p>
                </div>
            </div>

            <!-- খরচের লাইভ তালিকা বিবরণী -->
            <div class="pdf-page-break">
                <h3 class="text-md font-bold text-gray-800 mb-3 flex justify-between items-center">
                    <span>📋 খরচের বিবরণী</span>
                    <span id="currentDate" class="text-xs text-gray-400"></span>
                </h3>
                <div class="border rounded-xl divide-y bg-white overflow-hidden" id="expenseList">
                    <p class="text-gray-400 text-center py-4 text-sm">এখনো কোনো খরচ লেখা হয়নি।</p>
                </div>

                <!-- লাইভ মোট খরচের ফুটার (যা পিডিএফেও সুন্দরভাবে আসবে) -->
                <div id="totalExpenseFooter" class="mt-3 bg-gray-50 p-3 rounded-xl border flex justify-between items-center hidden">
                    <span class="text-sm font-bold text-gray-700">সর্বমোট খরচফল:</span>
                    <span class="text-lg font-black text-red-600"><span id="footerTotalAmount">0</span> ৳</span>
                </div>
            </div>
        </div>

        <!-- ইনপুট সেকশন (যা পিডিএফে আসবে না) -->
        <div class="mt-6 space-y-4">
            <!-- বাজেট যোগ করার ঘর -->
            <div class="bg-indigo-50 p-4 rounded-xl">
                <label class="block text-sm font-semibold text-gray-700 mb-2">বাজেট টাকা যোগ করুন:</label>
                <div class="flex gap-2">
                    <input type="number" id="monthlyBudget" placeholder="টাকার পরিমাণ" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <button onclick="addBudget()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">যোগ</button>
                </div>
            </div>

            <!-- নতুন খরচ এন্ট্রি -->
            <div class="bg-gray-50 p-4 rounded-xl">
                <p class="text-sm font-semibold text-gray-700 mb-3">নতুন খরচ যোগ করুন:</p>
                <div class="flex flex-col gap-2">
                    <input type="text" id="expenseReason" placeholder="কোথায় খরচ করলেন?" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                    <div class="flex gap-2">
                        <input type="number" id="expenseAmount" placeholder="টাকার পরিমাণ" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <button onclick="addExpense()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-green-700 transition w-1/3">যোগ করুন</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- কন্ট্রোল বাটন সমূহ -->
        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="downloadPDF()" class="bg-blue-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-700 transition shadow-md">📄 পিডিএফ ডাউনলোড</button>
            <button onclick="clearAll()" class="bg-gray-200 text-gray-700 py-2.5 rounded-lg font-semibold text-sm hover:bg-gray-300 transition">🔄 সব মুছুন</button>
        </div>
    </div>

    <!-- মূল জাভাস্ক্রিপ্ট ফাইল লিঙ্ক -->
    <script src="app.js"></script>
</body>
</html>
